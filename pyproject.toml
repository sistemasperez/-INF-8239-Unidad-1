[project]
name = "unidad-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anibal Perez", email = "anibalw23@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pytest>=8.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
]

[project.scripts]
unidad-1 = "unidad_1:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src/unidad_1"]
